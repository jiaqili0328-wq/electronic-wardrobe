:root{
  --bg:#F6F4F0;            /* 暖纸底 */
  --panel:#FCFBF8;
  --card:#FFFFFF;
  --line:#EAE5DB;
  --line-soft:#F0ECE4;
  --ink:#27231D;           /* 主文字 */
  --ink-2:#8B857A;         /* 次级文字 */
  --ink-3:#B4AEA2;         /* 弱文字 */
  --accent:#A67C52;        /* 陶土棕 */
  --accent-soft:#F1E9DD;
  --accent-deep:#8A6540;
  --ok:#6F9C7C;
  --warn:#C26A4B;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 1px 2px rgba(39,35,29,.04), 0 4px 14px rgba(39,35,29,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --tab-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);outline:none}
svg{display:block}

/* ---------- 头部 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  background:rgba(246,244,240,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:34px;height:34px;border-radius:10px;
  background:var(--ink);color:#F6F4F0;
  display:flex;align-items:center;justify-content:center;
}
.brand h1{font-size:17px;font-weight:650;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:2.2px;margin-top:1px}
.sync{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--ink-2);
  background:var(--panel);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;
}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.ok .dot{background:var(--ok)}
.sync.err .dot{background:var(--warn)}
.sync.syncing .dot{
  background:transparent;
  border:2px solid var(--accent);
  border-top-color:transparent;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 主内容 ---------- */
main{max-width:1200px;margin:0 auto;padding:20px 18px 110px}
section.view{display:none;animation:fade .25s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.pg-title{font-size:16px;font-weight:650;margin:6px 2px 14px;letter-spacing:.3px}

/* 数据状态区 */
.state-box{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:42px 20px;text-align:center;color:var(--ink-2);
  background:var(--panel);
}
.state-box .ic{width:38px;height:38px;margin:0 auto 10px;color:var(--ink-3)}
.state-box p{font-size:13.5px}
.state-box .retry{
  margin-top:14px;display:inline-flex;align-items:center;gap:6px;
  background:var(--ink);color:#F6F4F0;font-size:13px;
  padding:9px 18px;border-radius:999px;
}
.state-box .retry svg{width:14px;height:14px}

/* 骨架 */
.skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.skel-grid .sk{aspect-ratio:3/4;border-radius:var(--radius);background:linear-gradient(100deg,#EFEBE3 40%,#F6F3EC 50%,#EFEBE3 60%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- 总览 ---------- */
.stats{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:auto auto;gap:10px;margin-bottom:18px;align-items:stretch}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;
}
.stat b{display:block;font-size:24px;font-weight:650;letter-spacing:.3px}
.stat span{font-size:12px;color:var(--ink-2)}
.stat .num{display:flex;align-items:baseline;gap:2px}
.stat .unit{font-size:12px;color:var(--ink-3);font-weight:400}
/* 明日穿搭：左侧跨整高 */
.stat-outfit{grid-row:1 / span 2;grid-column:1}
/* 右侧指标区：身高体重/肩胸腰臀 并排，下方接百分比堆积图 */
.stat-side{grid-column:2;display:flex;flex-direction:column;gap:10px;min-width:0}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){
  .stats{grid-template-columns:1fr;grid-template-rows:auto}
  .stat-outfit{grid-row:auto;grid-column:1}
  .stat-side{grid-column:1}
  .metric-row{grid-template-columns:1fr}
}
/* 可编辑身体数据板块 */
.stat .body-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stat .body-badge{
  display:inline-flex;font-size:10px;font-weight:600;color:#8A6238;
  background:#F2E8DA;border:1px solid #E4D8C6;border-radius:99px;
  padding:2px 9px;letter-spacing:.3px;flex:none
}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.metric{display:flex;flex-direction:column;gap:3px;text-align:center}
.metric label{font-size:10.5px;color:var(--ink-3)}
.metric .inp{display:flex;align-items:center;justify-content:center;gap:2px}
.metric input{
  width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;
  padding:5px 3px;font-size:13px;font-weight:650;color:var(--ink);
  background:var(--bg);text-align:center;-moz-appearance:textfield
}
.metric input::-webkit-outer-spin-button,.metric input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.metric input:focus{outline:none;border-color:var(--accent);background:#fff}
.metric .u{font-size:9.5px;color:var(--ink-3);flex:none}

/* ---------- 明日穿搭推荐面板 ---------- */
#outfit-rec{}
.rec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rec-title{font-size:13px;font-weight:600;color:var(--ink)}
.rec-weather{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:#F8F5F0;border-radius:99px;padding:3px 10px}
.rec-weather .w-temp{font-weight:600;color:var(--ink)}
.rec-body{display:flex;flex-direction:column;gap:10px}
.rec-thumbs{display:flex;flex-wrap:wrap;gap:8px}
.rec-thumb{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rec-thumb-img{width:62px;height:62px;border-radius:10px;border:1px solid var(--line-soft);background:#FAF6F1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rec-thumb-img img{width:100%;height:100%;object-fit:cover;display:block}
.rec-thumb-img .ph{width:26px;height:26px;color:#C9C2B4}
.rec-thumb-label{font-size:10px;color:var(--ink-2);text-align:center;line-height:1.25;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-info{flex:1;min-width:0}
.rec-items{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.rec-chip{font-size:11px;font-weight:500;color:#5A3D26;background:#F2E8DA;border:1px solid #E8DCC8;border-radius:99px;padding:3px 9px;white-space:nowrap}
.rec-scheme{font-size:11.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec-scheme b{color:var(--accent);font-weight:600}
.rec-swatches{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.rec-sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);display:inline-block}
.rec-scheme-tip{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.rec-style{color:#7A5230;background:#F3E9DA;border:1px solid #E6D6BF;border-radius:99px;padding:2px 10px;font-weight:600}
.rec-style b{color:#7A5230}
.rec-tip{font-size:11px;line-height:1.5;color:var(--ink-2);background:#FBF7F1;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;margin-right:4px;border:1px solid rgba(0,0,0,.12)}
.rec-placeholder{font-size:11.5px;color:var(--ink-3);text-align:center;padding:16px 0}
.rec-loading{font-size:11px;color:var(--ink-3)}
/* 首页快捷操作网格（2×3）：添加上衣/下装/外套/连衣裙/鞋子 + 换一套 */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick-btn{
  font-size:12px;font-weight:600;padding:9px 4px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:border-color .15s,color .15s,background .15s
}
.quick-btn:hover,.quick-btn:active{border-color:var(--accent);color:var(--accent)}
.quick-btn svg{width:16px;height:16px}

/* 分布图 - 作为指标区下方从属展示部分，融入同一视觉区块 */
.dist-list{margin-top:0;display:flex;flex-direction:column;gap:0}
.dist-card{
  background:#FAF7F2;border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:12px 14px;
}
.dist-head{
  font-size:12px;font-weight:600;color:var(--ink-2);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.dist-row{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.dist-row:last-child{margin-bottom:0}
.dist-row-label{
  font-size:13px;font-weight:600;color:var(--ink);
  white-space:nowrap;min-width:42px;flex-shrink:0;
}
.dist-row-count{
  font-size:11.5px;color:var(--ink-3);font-weight:500;
  white-space:nowrap;min-width:28px;flex-shrink:0;text-align:right;
}
.stacked-bar{flex:1;min-width:0}
.stacked-bar .bar-track{
  flex:1;height:30px;border-radius:99px;background:#F2E8DA;
  overflow:hidden;display:flex;position:relative;
}
.stacked-bar .bar-seg{
  height:100%;min-width:0;transition:width .5s ease;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  border-right:1.5px solid rgba(255,255,255,.45);
}
.stacked-bar .bar-seg:last-child{border-right:none}
/* 段内标签 - 单一纯色文字（由 JS 依该段亮度计算），平整无阴影 */
.stacked-bar .seg-label{
  font-size:12px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;padding:0 4px;line-height:1.15;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.stacked-bar .seg-label .seg-pct{font-size:10.5px;font-weight:400;opacity:.9}
/* 小段隐藏文字，仅用 tooltip */
.stacked-bar .bar-seg[data-small="1"] .seg-label{display:none}
/* 小段隐藏文字，仅用 tooltip */
.stacked-bar .bar-seg[data-small="1"] .seg-label{display:none}

.wall-title{font-size:13px;font-weight:600;color:var(--ink-2);margin:20px 2px 10px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.wall-title::after{content:"";flex:1;height:1px;background:var(--line-soft)}

/* ---------- 衣物网格 ---------- */
.grid{
  display:grid;gap:10px;
  grid-template-columns:repeat(3,1fr);
}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:680px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(7,1fr)}}

.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;position:relative;transition:transform .15s ease, box-shadow .15s ease;
}
.item:active{transform:scale(.985)}
.thumb{
  aspect-ratio:1/1;width:100%;
  background:#F0ECE4;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{width:52px;height:52px;color:#C9C2B4}
.thumb .cat{
  position:absolute;left:9px;top:9px;
  font-size:11px;color:var(--accent-deep);background:rgba(255,255,255,.92);
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);
  backdrop-filter:blur(4px);
}
.thumb .thick{
  position:absolute;left:9px;bottom:9px;
  font-size:11px;color:#7a5a3a;background:rgba(255,255,255,.92);
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);
  backdrop-filter:blur(4px);
}
.thumb .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.edit,.del{
  width:30px;height:30px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:rgba(39,35,29,.62);color:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.edit svg,.del svg{width:14px;height:14px}
.item:hover .edit,.item:hover .del,.edit:focus,.del:focus{opacity:1}
@media(hover:none){.edit,.del{opacity:1}}
.chip-tag{font-size:12px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);padding:4px 11px;border-radius:99px}
.chip-tag.thick-tag{color:var(--accent-deep);border-color:var(--accent)}
.chip-tag.brand-tag{color:var(--ink-2)}
.chip-tag.style-tag{color:#7A5230;border-color:#E6D6BF}
.chip-tag.color-tag{display:inline-flex;align-items:center;gap:5px}
.chip-tag .cdot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.14);display:inline-block}
.meta{padding:9px 11px 11px}
.meta .nm{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .br{font-size:11.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .cl{font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .st{font-size:11px;color:#7A5230;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .nt{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 卡片缩略图右下角色点（多色时并排展示） */
.cdots{position:absolute;bottom:6px;right:6px;display:flex;gap:3px;z-index:2}
.chip-tag.color-tag .cdots{position:static;gap:4px;margin-right:2px}
.cdot-card{position:absolute;bottom:6px;right:6px;width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2}

/* 添加卡片：与 .item 完全一致的结构（缩略图 + meta），等高对齐 */
.add-card{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:left;padding:0;position:relative;
  transition:border-color .15s,color .15s,box-shadow .15s;
}
.add-card:active{transform:scale(.985)}
.add-card .add-thumb{
  aspect-ratio:1/1;width:100%;
  background:repeating-linear-gradient(45deg,#F4F1EB,#F4F1EB 10px,#EFEBE2 10px,#EFEBE2 20px);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);border-bottom:1px solid var(--line);
}
.add-card .add-thumb svg{width:30px;height:30px}
.add-card .add-meta{padding:9px 11px 11px;font-size:13.5px;font-weight:550;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-card:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.add-card:hover .add-thumb{color:var(--accent)}

/* ---------- 弹窗 ---------- */
.modal-mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(39,35,29,.38);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex}
.modal{
  width:100%;max-width:560px;
  background:var(--bg);
  border-radius:22px 22px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  animation:up .28s cubic-bezier(.2,.8,.3,1);
}
@media(min-width:640px){
  .modal-mask{align-items:center}
  .modal{border-radius:22px;padding:24px;box-shadow:var(--shadow)}
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{font-size:17px;font-weight:650;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal h2 .x{width:30px;height:30px;border-radius:50%;background:var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.modal h2 .x svg{width:14px;height:14px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.3px}
.fld label .req{color:var(--warn)}
.fld input[type=text],.fld textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--card);padding:11px 13px;font-size:16px;
}
.fld textarea{resize:none;min-height:64px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  font-size:13px;color:var(--ink-2);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;
}
.chips button.on{background:var(--ink);color:#F6F4F0;border-color:var(--ink)}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:13.5px;color:var(--ink);transition:border-color .12s,background .12s,transform .08s}
.cchip:hover{border-color:var(--accent);background:var(--accent-soft)}
.cchip:active{transform:scale(.97)}
.cchip.on{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.cchip.on .cdot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.cchip .cdot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.14);display:inline-block;flex:0 0 auto;background:var(--sw)}
.cchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%}
.caddrow{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.caddrow input[type=color]{width:42px;height:42px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);flex:none;cursor:pointer}
.caddrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:14px}
.caddrow button{flex:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;height:40px;font-size:14px;font-weight:600}
.cempty{font-size:12.5px;color:var(--ink-3);padding:6px 2px;display:inline-block}
.cdivider{margin:12px 0 6px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);font-weight:600}
/* 高级颜色（拼色/渐变/花色）构建器 — 统一四类型 */
.adv-toggle{margin-top:8px;align-self:flex-start;border:1px dashed var(--accent);background:var(--card);color:var(--accent-deep);border-radius:99px;padding:7px 14px;font-size:12.5px;cursor:pointer}

function detectDominantColor(dataUrl, cb){
  try{
    var img = new Image();
    img.onload = function(){
      try{
        var n = 36, c = document.createElement("canvas");
        c.width = n; c.height = n;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, n, n);
        var d = ctx.getImageData(0,0,n,n).data;
        var rs=0,gs=0,bs=0,cnt=0;
        for(var i=0;i<d.length;i+=4){
          var a=d[i+3], r=d[i], g=d[i+1], b=d[i+2];
          if(a<128) continue;
          var br = 0.299*r + 0.587*g + 0.114*b;
          if(br>245) continue;   /* 跳过近白背景 */
          if(br<8)   continue;   /* 跳过近黑阴影 */
          rs+=r; gs+=g; bs+=b; cnt++;
        }
        if(cnt<5){ /* 几乎全白，退回整体平均 */
          for(var j=0;j<d.length;j+=4){ if(d[j+3]<128) continue; rs+=d[j]; gs+=d[j+1]; bs+=d[j+2]; cnt++; }
        }
        if(cnt<=0){ cb(""); return; }
        cb(nearestPalette([Math.round(rs/cnt),Math.round(gs/cnt),Math.round(bs/cnt)]));
      }catch(e){ cb(""); }
    };
    img.onerror = function(){ cb(""); };
    img.src = dataUrl;
  }catch(e){ cb(""); }
}
function nearestPalette(rgb){
  var best="", bestD=1e9;
  COLOR_PALETTE.forEach(function(c){
    var dr=parseInt(c.hex.slice(1,3),16)-rgb[0];
    var dg=parseInt(c.hex.slice(3,5),16)-rgb[1];
    var db=parseInt(c.hex.slice(5,7),16)-rgb[2];
    var dist=dr*dr+dg*dg+db*db;
    if(dist<bestD){ bestD=dist; best=c.name; }
  });
  return best;
}
function hexToRgb(hex){
  if(typeof hex === "string"){
    var mm = hex.match(/^rgb\((\d+),(\d+),(\d+)\)$/);   /* 兼容 colorHex 解析出的 rgb() 形式 */
    if(mm) return [+mm[1], +mm[2], +mm[3]];
  }
  hex = (hex || "").trim();
  if(hex[0] !== "#") return [204,204,204];
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
/* RGB → 色相（低饱和视为中性，返回 -1） */
function rgbHue(rgb){
  var r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(d<0.12) return -1;
  var h;
  if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
  h=Math.round(h*60); if(h<0) h+=360;
  return h;
}
/* 两色和谐度评分（越高越搭）：含中性色 2.0；同色系高；互补亦可；中间色相易冲突 */
function colorHarmony(a,b){
  if(!a||!b) return 1.2;
  if(NEUTRAL_COLORS.indexOf(a)>=0 || NEUTRAL_COLORS.indexOf(b)>=0) return 2.0;
  var ha=rgbHue(hexToRgb(colorHex(a))), hb=rgbHue(hexToRgb(colorHex(b)));
  if(ha<0||hb<0) return 2.0;
  var diff=Math.abs(ha-hb); diff=Math.min(diff,360-diff);
  if(diff<30) return 1.7;   /* 同色系 */
  if(diff>150) return 1.4;  /* 互补撞色，常有意 */
  return 0.8;               /* 中间色相，易冲突 */
}
/* 由已选颜色推导配色方案（名称），覆盖更丰富的色系类型 */
function colorScheme(cols){
  cols = cols.filter(Boolean);
  if(!cols.length) return "自由搭配";
  if(cols.every(function(c){ return NEUTRAL_COLORS.indexOf(c)>=0; })) return "中性极简";
  var nonN = cols.filter(function(c){ return NEUTRAL_COLORS.indexOf(c)<0; });
  if(nonN.length===1) return "彩色点睛";
  var hues = nonN.map(function(c){ return rgbHue(hexToRgb(colorHex(c))); }).filter(function(h){ return h>=0; });
  if(hues.length>=2){
    var mx=Math.max.apply(null,hues), mn=Math.min.apply(null,hues), span=mx-mn;
    /* 大地色系：暖调低饱和的驼/棕/卡其/杏/米白/酒红/橙/藏青/牛仔蓝 */
    var earth=["驼色","卡其","棕","杏色","米白","酒红","橙","藏青","牛仔蓝"];
    if(nonN.every(function(c){ return earth.indexOf(c)>=0; })) return "大地色系";
    if(span<=35) return "同色系渐变";
    if(span>=150) return "互补撞色";
    return "邻近撞色";
  }
  return "双彩平衡";
}

/* ===== 统一四类型颜色系统 =====
 * 支持四种颜色类型，每种在存储中带明确类型标签：
 *   "纯色:红"              → 纯色，名称=红（查调色板取色值）
 *   "纯色:浅绿|#90EE90"     → 纯色，名称=浅绿，精确色值=#90EE90
 *   "纯色:#A2C4E0"          → 纯色，名称=#A2C4E0（直接当 hex 用）
 *   "渐变:linear-gradient(135deg,#A,#B)"
 *   "拼色:linear-gradient(90deg,#A 0 50%,#B 50% 100%)"
 *   "花色·条纹:repeating-linear-gradient(45deg,...)"
 *   "花色·格纹:repeating-linear-gradient(0deg,...),repeating-linear-gradient(90deg,...)"
 *   "花色·波点:radial-gradient(circle at center,...)"
 *
 * 格式：TYPE_PREFIX=":" 分隔类型标签与载荷
 * 旧格式（无类型前缀的裸字符串）自动识别为「纯色」并兼容解析
 */
var COLOR_TYPE_SEP = ":";
var COLOR_VAL_SEP = "|"; /* 纯色内部：名称与精确色值的分隔 */
var COLOR_TYPES = ["纯色","拼色","渐变","花色·条纹","花色·格纹","花色·波点"];

/* 解析单个颜色 token 为结构化对象 {type, raw, payload} */
function parseColorToken(token){
  token = String(token||"").trim(); if(!token) return null;
  var idx = token.indexOf(COLOR_TYPE_SEP);
  if(idx > 0){
    var type = token.slice(0,idx).trim(), payload = token.slice(idx+1).trim();
    if(COLOR_TYPES.indexOf(type) >= 0) return {type:type, raw:token, payload:payload};
  }
  /* 无类型前缀 → 旧格式，统一视为「纯色」 */
  return {type:"纯色", raw:token, payload:token};
}
function colorTypeOf(t){ var p=parseColorToken(t); return p?p.type:""; }
/* 一级类型：花色·条纹/格纹/波点 统一归为「花色」，用于「每个类型内部单选」判定 */
function colorTopType(t){ var p=parseColorToken(t); if(!p) return ""; return p.type.indexOf("花色")===0?"花色":p.type; }
function colorPayloadOf(t){ var p=parseColorToken(t); return p?p.payload:""; }

/* 纯色载荷解析："name" / "name|#hex" / "#hex" / "rgb(...)" → {name, css} */
function solidNameAndCss(payload){
  var vi = payload.indexOf(COLOR_VAL_SEP);
  if(vi > 0) return {name:payload.slice(0,vi).trim(), css:payload.slice(vi+1).trim()};
  if(/^#[0-9a-fA-F]{3,8}$/i.test(payload) || /^rgb/i.test(payload)) return {name:payload, css:payload};
  return {name:payload, css:COLOR_HEX[payload]||""};
}

/* 从 token 取显示名（用于 chip 文字标签） */
function colorDisplayOf(token){
  var p = parseColorToken(token); if(!p) return "";
  if(p.type==="纯色"){ var sc=solidNameAndCss(p.payload); return sc.name; }
  return p.type; /* 非纯色直接显示类型名 */
}

/* 从 token 取 CSS 色值（用于圆点 background） */
function colorCssOf(token){
  var p = parseColorToken(token); if(!p) return "#B9A98F";
  if(p.type!=="纯色") return p.payload; /* 非纯色直接透传 CSS */
  var sc = solidNameAndCss(p.payload);
  if(sc.css) return sc.css;
  return resolveColor(sc.name) || "#B9A98F";
}

/* ===== 向后兼容的旧函数（供卡片/详情/推荐等调用方继续使用）===== */

/* 颜色中文标签（向后兼容 colorLabel 接口） */
function colorLabel(c){ return colorDisplayOf(c)||String(c||""); }

/* 是否非纯色（用于判断是否透传 CSS background） */
function isAdvancedColor(token){ var t=colorTypeOf(token); return t!=="纯色"; }

/* 圆点色值（swatchOf 向后兼容接口） */
function swatchOf(name){ return colorCssOf(name); }

/* 取代表性纯色（用于配色和谐度评分） */
function solidOf(v){
  v = String(v==null?"":v).trim(); if(!v) return "#B9A98F";
  if(v.charAt(0)==="["){
    try{ var arr=JSON.parse(v); if(Array.isArray(arr)){ for(var i=0;i<arr.length;i++){ var s=solidOf(arr[i]); if(s && s!=="#B9A98F") return s; } } }catch(e){}
    return "#B9A98F";
  }
  var css = colorCssOf(v);
  if(isAdvancedColor(v)){ var m=css.match(/#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})/i); return m?("#"+m[1].toLowerCase()):"#B9A98F"; }
  return resolveColor(css) || css || "#B9A98F";
}

/* colorHex 向后兼容（返回代表性纯色 hex/rgb） */
function colorHex(name){ return solidOf(name); }

/* ===== 颜色字段读写（多选 JSON 数组）===== */

/* 解析「颜色」字段：新版为 JSON 数组（每项为 TYPE:payload 格式），旧版兼容 */
function parseColors(str){
  if(!str) return [];
  str = String(str).trim(); if(!str) return [];
  if(str.charAt(0)==="["){
    try{ var a=JSON.parse(str); if(Array.isArray(a)) return a.filter(Boolean).map(function(x){return String(x).trim();}); }catch(e){}
  }
  return [str];
}

/* 序列化颜色数组：空→""；单色→字符串；多色→JSON 数组 */
function serializeColors(arr){
  arr=(arr||[]).filter(function(x){return x&&String(x).trim();}).map(function(x){return String(x).trim();});
  if(!arr.length) return "";
  if(arr.length===1) return arr[0];
  return JSON.stringify(arr);
}

/* 构建新的纯色 token：makeSolid("红") → "纯色:红"；makeSolid("浅绿","#90EE90") → "纯色:浅绿|#90EE90" */
function makeSolid(name, cssVal){
  name = String(name||"").trim(); if(!name) return "";
  if(cssVal) return "纯色:"+name+COLOR_VAL_SEP+String(cssVal).trim();
  return "纯色:"+name;
}

/* 构建非纯色 token：makeAdvanced("渐变", cssValue) → "渐变:cssValue" */
function makeAdvanced(type, cssValue){
  return type+COLOR_TYPE_SEP+String(cssValue).trim();
}

/* 有效颜色分类列表（去重、按关联衣物数排序） */
function availableColors(){
  var cnt={};
  KEYS.slice(0,5).forEach(function(k){
    (cache[k]||[]).forEach(function(r){
      parseColors(r["颜色"]).forEach(function(c){ c=String(c).trim(); if(c) cnt[c]=(cnt[c]||0)+1; });
    });
  });
  return Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]||(a<b?-1:1); });
}

/* 页面加载后反向重建自定义颜色注册表（纯色中含精确色值的条目自动注册） */
function rebuildCustomColors(){
  KEYS.slice(0,5).forEach(function(k){
    (cache[k]||[]).forEach(function(r){
      parseColors(r["颜色"]).forEach(function(c){
        var p=parseColorToken(c); if(!p) return;
        if(p.type!=="纯色") return; /* 非纯色无需注册 */
        var sc=solidNameAndCss(p.payload);
        if(!sc.css) return; /* 无精确色值无需注册 */
        if(COLOR_HEX[sc.name]) return; /* 已在调色板中的标准色无需注册 */
        if(!CUSTOM_COLORS[sc.name]) CUSTOM_COLORS[sc.name]=sc.css;
      });
    });
  });
}

/* 颜色 token 列表按类型分组（用于下拉按钮选择器） */
function groupColorsByType(list){
  var g = { "纯色":[], "拼色":[], "渐变":[], "花色·条纹":[], "花色·格纹":[], "花色·波点":[] };
  (list||[]).forEach(function(c){
    var t = colorTypeOf(c);
    if(g[t]) g[t].push(c); else g["纯色"].push(c);
  });
  return g;
}

/* 花色图案 CSS（条纹 / 格纹 / 波点） */
function hxPattern(pat, A, B){
  if(pat==="条纹") return "repeating-linear-gradient(45deg,"+A+" 0 9px,"+B+" 9px 18px)";
  if(pat==="格纹") return "repeating-linear-gradient(0deg,"+A+" 0 9px,"+B+" 9px 18px),repeating-linear-gradient(90deg,"+A+" 0 9px,"+B+" 9px 18px)";
  return "radial-gradient(circle at center,"+B+" 2.5px,"+A+" 2.6px) 0 0 / 14px 14px";
}

/* 颜色下拉按钮选择器 HTML：四大类型按钮 + 花色下三级子按钮；每类面板内「自定义生成器」在上、「已存颜色」圆点在下且可点选 */
function colorSelectorHtml(allColors, selected){
  var g = groupColorsByType(allColors);
  var sel = selected||[];
  function has(t){ return sel.some(function(c){ return colorTypeOf(c)===t; }); }
  function hasHx(){ return sel.some(function(c){ return (colorTypeOf(c)||"").indexOf("花色")===0; }); }
  function chips(t){
    var arr = g[t]||[];
    if(!arr.length) return '<span class="cempty">暂无已存颜色，可在上方自定义添加</span>';
    return arr.map(function(c){
      var on = sel.indexOf(c)>=0;
      return '<button type="button" data-color="'+esc(c)+'" data-ctype="'+esc(t)+'" class="cchip'+(on?" on":"")+'" style="--sw:'+colorCssOf(c)+'" title="'+esc(colorLabel(c))+'"><span class="cdot"></span>'+esc(colorLabel(c))+'</button>';
    }).join("");
  }
  /* 已存颜色块：位于自定义生成器下方，圆点可点选；仅在有数据时显示分隔标签 */
  function existing(t){
    var arr = g[t]||[];
    if(!arr.length) return '<div class="cchips" data-group="'+t+'"><span class="cempty">暂无已存颜色，可在上方自定义添加</span></div>';
    return '<div class="cdivider"><span>已存颜色</span></div><div class="cchips" data-group="'+t+'">'+chips(t)+'</div>';
  }
  function solidAdd(){ return '<div class="caddrow"><input type="color" id="f_c_pick" value="#B9A98F" title="选取精确颜色"><input type="text" id="f_c_name" placeholder="颜色名，如：浅绿 / 米白" maxlength="20"><button type="button" id="f_c_add">添加</button></div>'; }
  function pairAdd(type, pre){
    return '<div class="caddrow adv">'
      + '<div class="cadv-pick-wrap"><label>主色</label><input type="color" id="f_'+pre+'_a" value="#FF5733"></div>'
      + '<div class="cadv-pick-wrap"><label>副色</label><input type="color" id="f_'+pre+'_b" value="#1C1C1C"></div>'

  }

    + '<div class="ctype-sec" data-ctype="纯色">'

      + '<div class="ctype-body">'+solidAdd()+existing("纯色")+'</div></div>'
    + '<div class="ctype-sec" data-ctype="拼色">'
      + '<button type="button" class="ctype-head">拼色 <span class="badge">'+(g["拼色"]||[]).length+'</span><span class="caret">▾</span></button>'
      + '<div class="ctype-body">'+pairAdd("拼色","pc")+existing("拼色")+'</div></div>'
    + '<div class="ctype-sec" data-ctype="渐变">'
      + '<button type="button" class="ctype-head">渐变 <span class="badge">'+(g["渐变"]||[]).length+'</span><span class="caret">▾</span></button>'
      + '<div class="ctype-body">'+pairAdd("渐变","gd")+existing("渐变")+'</div></div>'
    + '<div class="ctype-sec" data-ctype="花色">'
      + '<button type="button" class="ctype-head">花色 <span class="caret">▾</span></button>'
      + '<div class="ctype-body">'+hxSub("条纹")+hxSub("格纹")+hxSub("波点")+'</div></div>';
}

/* 颜色下拉按钮选择器接线（新增/编辑表单共用）；addFn 负责选中（纯色单选） */
function wireColorSelector(addFn){
  $$("#f_color .ctype-head").forEach(function(h){
    h.addEventListener("click", function(){ h.closest(".ctype-sec").classList.toggle("open"); });
  });
  $$("#f_color .csub-head").forEach(function(h){
    h.addEventListener("click", function(){ h.closest(".csub-sec").classList.toggle("open"); });
  });
  $$("#f_color .cchip").forEach(function(b){
    b.addEventListener("click", function(){ addFn(b.getAttribute("data-color")); });
  });
  /* 纯色添加（单选） */
  var sp=$("#f_c_pick"), sn=$("#f_c_name"), sb=$("#f_c_add");
  if(sb) sb.addEventListener("click", function(){
    var v=(sn&&sn.value||"").trim(); var p=(sp&&sp.value||"").trim()||"#B9A98F";
    if(!v) v=p;
    var css=null;
    if(/^#/.test(v)){ /* hex 名，无需额外色值 */ }
    else if(COLOR_HEX[v]){ /* 标准色名可解析，无需额外色值 */ }
    else { css=p; }
    addFn(makeSolid(v, css));
    if(sn) sn.value="";
  });
  /* 拼色 / 渐变 添加（四类互斥） */
  bindPairSel("拼色", "#f_pc_a", "#f_pc_b", "#f_pc_add", addFn);
  bindPairSel("渐变", "#f_gd_a", "#f_gd_b", "#f_gd_add", addFn);
  /* 花色三级子按钮添加（四类互斥） */
  ["条纹","格纹","波点"].forEach(function(pat){ bindHxSel(pat, addFn); });
}
function bindPairSel(type, aSel, bSel, btnSel, addFn){
  var a=$(aSel), b=$(bSel), btn=$(btnSel); if(!btn) return;
  btn.addEventListener("click", function(){
    var A=a&&a.value, B=b&&b.value; if(!A||!B) return;
    var css = type==="渐变" ? "linear-gradient(135deg,"+A+","+B+")" : "linear-gradient(90deg,"+A+" 0 50%,"+B+" 50% 100%)";
    addFn(makeAdvanced(type, css));
  });
}
function bindHxSel(pat, addFn){
  var a=$("#f_hx_"+pat+"_a"), b=$("#f_hx_"+pat+"_b"), btn=$("#f_hx_"+pat+"_add");
  if(!btn) return;
  btn.addEventListener("click", function(){
    var A=a&&a.value, B=b&&b.value; if(!A||!B) return;
    addFn(makeAdvanced("花色·"+pat, hxPattern(pat, A, B)));
  });
}

/* ================= 工具 ================= */
function $(s,c){ return (c||document).querySelector(s); }
function $$(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }

/* ================= 身体数据（身高体重 / 肩胸腰臀）本地可编辑 ================= */
var METRIC_DEFAULTS = { h:152, w:52, shoulder:36, bust:85, waist:70, hip:90 };
var METRIC_KEYS = ["h","w","shoulder","bust","waist","hip"];
/* 根据肩胸腰臀自动识别体型 */
function detectBodyType(m){
  var s = m.shoulder || 0, b = m.bust || 0, w = m.waist || 0, h = m.hip || 0;
  var whr = w > 0 ? (h / w) : 1; /* 臀腰比（臀/腰） */
  var diffBH = Math.abs(b - h);    /* 胸臀差 */
  var hwDiff = h - w;              /* 臀腰差 */
  /* 身高判断体型大小前缀 */
  var ht = m.h || 0;
  var sizePrefix = ht < 155 ? "娇小" : (ht < 165 ? "标准" : "高挑");
  /* 梨形：臀明显大于胸，腰较细 */
  if(whr >= 1.05 && hwDiff >= 8) return sizePrefix + "梨形";
  /* 苹果形：腰围接近或超过胸/臀，中心肥胖倾向 */
  if(w >= b * 0.92 && w >= h * 0.92) return sizePrefix + "苹果形";
  /* 沙漏形：胸臀接近，腰明显更细 */
  if(diffBH <= 6 && w < b * 0.78 && w < h * 0.78) return sizePrefix + "沙漏形";
  /* 倒三角：肩/胸明显大于臀 */
  if(s > h + 6 && b > h + 4) return sizePrefix + "倒三角";
  /* 直筒/矩形：三围接近 */
  if(diffBH <= 8 && hwDiff <= 8 && Math.abs(b - w) <= 10) return sizePrefix + "直筒形";
  /* 默认 */
  return sizePrefix + "梨形";
}
function loadMetrics(){

  METRIC_KEYS.forEach(function(k){ var v = m[k]; if(typeof v!=="number" || isNaN(v)) m[k] = METRIC_DEFAULTS[k]; });
  return m;
}

function parseWeather(code){

/* 温度体感 */
function getTempFeel(max, min){
  var avg = (max + min) / 2;
  if(avg < 10) return "寒冷"; if(avg < 18) return "凉爽"; if(avg < 26) return "舒适"; if(avg < 32) return "炎热"; return "酷热";
}
/* 根据天气生成推荐搭配：纯「厚度偏好 + 配色和谐」，不限制分类（新分类自动进入） */
function generateOutfit(weather){
  var isRain = [51,53,55,61,63,65,80,81,82,95,96,99].indexOf(weather.code) >= 0;
  /* 按最高温细分级（避免30度还推卫衣） */
  var maxT = weather.max;
  var tier = maxT >= 33 ? "酷热" : maxT >= 28 ? "炎热" : maxT >= 24 ? "温暖" : maxT >= 18 ? "舒适" : maxT >= 10 ? "凉爽" : "寒冷";
  /* 从给定池选一件：综合厚度偏好 + 配色方向 + 目标风格打分（不按分类过滤）
     colorGoal：和谐=偏好同色系；撞色=偏好互补撞色；点缀=在中性底色上点一抹亮色 */
  function pickFrom(pool, pref, baseColor, targetStyle, colorGoal){
    if(!pool || !pool.length) return null;
    var best=null, bestS=-1e9;
    pool.forEach(function(x){
      var sc = 0;
      var tk = x["厚度"] || "适中";   /* 未设置厚度默认按「适中」处理 */
      if(pref && pref.length) sc += (pref.indexOf(tk)>=0) ? 1.2 : 0;
      var xc = x["颜色"] || "";
      if(baseColor){
        var ch = colorHarmony(baseColor, xc);
        var bonus = 0;
        var ha=rgbHue(hexToRgb(colorHex(baseColor))), hb=rgbHue(hexToRgb(colorHex(xc)));
        if(ha>=0 && hb>=0){
          var diff=Math.abs(ha-hb); diff=Math.min(diff,360-diff);
          if(colorGoal==="和谐" && diff<30) bonus += 0.5;
          if(colorGoal==="撞色" && diff>150) bonus += 0.5;
        } else if(colorGoal==="点缀" && NEUTRAL_COLORS.indexOf(baseColor)>=0 && NEUTRAL_COLORS.indexOf(xc)<0){
          bonus += 0.4;  /* 中性底色上点一抹亮色，避免总是全中性 */
        }
        sc += ch*0.9 + bonus;
      } else if(colorGoal==="点缀" && NEUTRAL_COLORS.indexOf(xc)<0){
        sc += 0.4;  /* 首件就鼓励来点彩色 */
      }
      if(targetStyle && (x["风格"]||"") === targetStyle) sc += 1.0;  /* 风格契合加分 */
      sc += Math.random() * 0.2;       /* 换一套有变化 */
      if(sc > bestS){ bestS = sc; best = x; }
    });
    return best;
  }
  function pickBest(key, pref, baseColor, targetStyle){
    return pickFrom(cache[key] || [], pref, baseColor, targetStyle, colorGoal);
  }
  /* 目标风格：从衣橱实际拥有的风格里随机选一个（保证可达）；无则空 */
  var availStyles = {};
  KEYS.slice(0,5).forEach(function(k){ (cache[k]||[]).forEach(function(x){ var s=x["风格"]; if(s) availStyles[s]=1; }); });
  var stylePool = Object.keys(availStyles);
  var targetStyle = stylePool.length ? stylePool[Math.floor(Math.random()*stylePool.length)] : "";
  /* 配色方向：每套随机定一个，让「换一套」出现不同配色方案而非总中性 */
  var colorGoal = ["和谐","撞色","点缀"][Math.floor(Math.random()*3)];
  var prefThick = THICK_PREF[tier] || [];
  var items = [];
  var chosenColors = [];
  /* 连衣裙优先（一件解决上下装）；寒冷档不推 */
  var dress = null;
  if(tier !== "寒冷" && Math.random() < 0.45){ dress = pickBest("dresses", null, null, targetStyle); }  /* 连衣裙不受厚度限制 */
  if(dress){
    items.push({key:"dresses",rec:dress,slot:"连衣裙"});
    chosenColors = chosenColors.concat(parseColors(dress["颜色"]||""));
  } else {
    var top = pickBest("tops", prefThick, null, targetStyle);
    if(top){ items.push({key:"tops",rec:top,slot:"上装"}); chosenColors = chosenColors.concat(parseColors(top["颜色"]||"")); }
    var bottom = pickBest("bottoms", prefThick, top ? top["颜色"] : null, targetStyle);
    if(bottom){ items.push({key:"bottoms",rec:bottom,slot:"下装"}); chosenColors = chosenColors.concat(parseColors(bottom["颜色"]||"")); }
  }
  /* 外套：凉爽/寒冷才推；短袖夹克例外，温暖/舒适也可作为薄外套 */
  var outerPool = null;
  if(tier === "凉爽" || tier === "寒冷"){
    outerPool = cache.outerwear;
  } else if(tier === "温暖" || tier === "舒适"){
    outerPool = (cache.outerwear||[]).filter(function(x){ return x["分类"] === "短袖夹克"; });
  }
  if(outerPool && outerPool.length > 0 && ((tier === "凉爽" || tier === "寒冷") || Math.random() < 0.5)){
    var outer = pickFrom(outerPool, prefThick, chosenColors[0] || null, targetStyle, colorGoal);
    if(outer){ items.push({key:"outerwear",rec:outer,slot:"外套"}); chosenColors = chosenColors.concat(parseColors(outer["颜色"]||"")); }
  }
  /* 鞋子：同样按厚度偏好 + 配色（凉鞋=超薄、靴子=偏厚，自然区分季节） */
  var shoe = pickBest("shoes", prefThick, items.length ? items[items.length-1].rec["颜色"] : null, targetStyle);
  if(shoe){ items.push({key:"shoes",rec:shoe,slot:"鞋子"}); }
  return { items: items, feel: tier, isRain: isRain, weather: weather, scheme: colorScheme(chosenColors), style: targetStyle, colors: chosenColors, colorGoal: colorGoal };
}
/* 刷新明日穿搭推荐面板（获取天气 → 生成搭配 → 渲染到 DOM） */
function refreshOutfitRec(){
  var container = document.getElementById("outfit-rec");
  if(!container) return;
  function render(outfit, source){
    var w = outfit.weather;
    var wInfo = parseWeather(w.code);
    var thumbsHtml = outfit.items.map(function(it){
      var name = esc(it.rec["名称"] || it.rec["分类"] || it.slot);
      var src = imgSrcOf(it.rec, "图片");
      var cols = parseColors(it.rec["颜色"]);
      var sw = cols.length ? '<span class="rec-dots">'+cols.map(function(c){ return '<span class="rec-dot" style="background:'+swatchOf(c)+'" title="'+esc(colorLabel(c))+'"></span>'; }).join("")+'</span>' : '';
      var img = src
        ? '<img src="'+esc(src)+'" alt="'+name+'" loading="lazy">'
        : '<span class="ph">'+ICONS.hanger+'</span>';
      return '<div class="rec-thumb"><div class="rec-thumb-img">'+img+'</div><span class="rec-thumb-label">'+sw+name+'</span></div>';
    }).join("");
    container.innerHTML =
      '<div class="rec-hd">' +
        '<span class="rec-title">推荐搭配</span>' +
        '<span class="rec-weather">'+
          '<span class="w-temp">'+w.max+'°/'+w.min+'°</span>'+
          '<span>'+wInfo.t+'</span>'+
          (outfit.isRain ? ' · 有雨' : '') +
        '</span>' +
      '</div>' +
      '<div class="rec-body">' +
        '<div class="rec-thumbs">'+thumbsHtml+'</div>' +
        '<div class="rec-scheme">'+
          (outfit.style ? '<span class="rec-style">今日风格 · <b>'+esc(outfit.style)+'</b></span>' : '') +
          '<span class="rec-scheme-t">配色方案 · <b>'+esc(outfit.scheme||"自由搭配")+'</b></span>' +
        '</div>' +
        (outfit.colors && outfit.colors.length ? '<div class="rec-swatches">'+outfit.colors.filter(Boolean).map(function(c){ return '<span class="rec-sw" style="background:'+colorCssOf(c)+'" title="'+esc(colorLabel(c))+'"></span>'; }).join("")+'</div>' : '') +
        (SCHEME_TIPS[outfit.scheme] ? '<div class="rec-scheme-tip">'+esc(SCHEME_TIPS[outfit.scheme])+'</div>' : '') +
      '</div>';
  }
  function tryGenerate(weather){
    try {
      var outfit = generateOutfit(weather);
      if(outfit.items.length === 0){
        container.innerHTML = '<div class="rec-placeholder">衣橱中暂无足够衣物生成搭配，请先添加衣物</div>';
        return;
      }
      render(outfit, "自动天气");
    } catch(e) {
      container.innerHTML = '<div class="rec-placeholder">搭配生成出错，请刷新重试</div>';
    }
  }
  /* 优先使用缓存天气 */
  if(WEATHER_CACHE){
    tryGenerate(WEATHER_CACHE);
    return;
  }
  /* 尝试获取天气 */
  fetchWeather().then(function(w){
    if(w){ tryGenerate(w); }
    else {
      /* 降级：使用默认舒适天气 */
      tryGenerate({max:24,min:18,code:1});
    }
  }).catch(function(){
    tryGenerate({max:24,min:18,code:1});
  });
}

/* ================= 渲染：总览 ================= */
function renderOverview(){
  var v = $("#view-overview");
  if(!sdkOk){ v.innerHTML = stateBox("当前未连接资料库"); return; }
  var n = { tops:cache.tops.length, bottoms:cache.bottoms.length, outerwear:cache.outerwear.length, dresses:cache.dresses.length, shoes:cache.shoes.length };
  var total = n.tops + n.bottoms + n.outerwear + n.dresses + n.shoes;

  /* 分类分布（合一堆积图：类型名在条形左侧，不单独标题行） */
  var distRows = [];
  KEYS.slice(0,5).forEach(function(k){
    var preset = CLOTH_CATS[k] || [];
    var usedCats = [];
    cache[k].forEach(function(r){ var c=r["分类"]; if(c && usedCats.indexOf(c)<0) usedCats.push(c); });
    var cats = usedCats.length ? usedCats : preset;
    var counts = {};
    cats.forEach(function(c){ counts[c] = 0; });
    cache[k].forEach(function(r){ var c = r["分类"]; if(c && counts[c]!=null) counts[c]++; });
    /* 按数量降序排列 */
    var sortedCats = cats.filter(function(c){ return counts[c]>0; }).sort(function(a,b){ return counts[b] - counts[a]; });
    if(!sortedCats.length) return;
    var typeTotal = cache[k].length;
    /* 堆积条形段：整条连续渐变，色标锚定段右边界；方向=水平(90deg)，与横向条形一致 */
    var segsHtml = "";
    var gradStops = [];
    var cum = 0;
    sortedCats.forEach(function(c, idx){
      var rawPct = counts[c]/typeTotal*100;
      var pct = Math.round(rawPct);
      if(pct < 1 && counts[c] > 0) pct = 1;
      cum += pct;
      /* 颜色按该段在整条条形的累计位置插值 → 渐变严格跟随条形方向（水平） */
      var t = cum / 100;
      var col = lerpColor(GRAD_START, GRAD_END, t);
      gradStops.push(col + " " + cum + "%");
      var isSmall = pct < 10;
      var lblColor = getLabelColor(col);   /* 依该段实际亮度决定深/浅文字，保证对比 */
      var labelHtml = '<span class="seg-label" style="color:'+lblColor+'">'+esc(c)+'<span class="seg-pct">'+counts[c]+'件 '+pct+'%</span></span>';
      segsHtml += '<span class="bar-seg" style="width:'+pct+'%" data-small="'+(isSmall?1:0)+'" title="'+esc(c)+'：'+counts[c]+'件（'+pct+'%）">'+labelHtml+'</span>';
    });
    /* 主渐变：水平(90deg)，从奶油米白连续过渡到近黑深棕 */
    var grad = "linear-gradient(90deg, " + GRAD_START + " 0%, " + gradStops.join(", ") + ")";
    distRows.push('<div class="dist-row"><span class="dist-row-label">'+DB[k].name+'</span><div class="stacked-bar"><div class="bar-track" style="background:'+grad+'">'+segsHtml+'</div></div><span class="dist-row-count">'+typeTotal+'件</span></div>');
  });

  var m = loadMetrics();
  var bodyType = detectBodyType(m);
  /* 搭配推荐面板初始占位（异步获取天气后填充） */
  var outfitRecHtml = '<div id="outfit-rec" class="outfit-rec-loading">' +
    '<div class="rec-hd"><span class="rec-title">明日穿搭</span><span class="rec-loading">获取天气中…</span></div>' +
    '<div class="rec-body"><div class="rec-placeholder">正在根据明日天气为您生成搭配方案</div></div>' +
    '</div>';
  /* 首页快捷操作（2×3）：添加上衣/下装/外套/连衣裙/鞋子 + 换一套 */
  var quickGridHtml =
    '<div class="quick-grid">' +
      '<button type="button" class="quick-btn" data-act="add" data-key="tops">'+ICONS.tops+'<span>上衣</span></button>' +
      '<button type="button" class="quick-btn" data-act="add" data-key="bottoms">'+ICONS.bottoms+'<span>下装</span></button>' +
      '<button type="button" class="quick-btn" data-act="add" data-key="outerwear">'+ICONS.outerwear+'<span>外套</span></button>' +
      '<button type="button" class="quick-btn" data-act="add" data-key="dresses">'+ICONS.dresses+'<span>连衣裙</span></button>' +
      '<button type="button" class="quick-btn" data-act="add" data-key="shoes">'+ICONS.shoes+'<span>鞋子</span></button>' +
      '<button type="button" class="quick-btn" data-act="refresh-outfit">'+ICONS.retry+'<span>换一套</span></button>' +
    '</div>';
  var statsContent =
    '<div class="stats">' +
      /* 左：明日穿搭（跨整高），顶部为 2×3 快捷操作 */
      '<div class="stat stat-outfit" id="stat-outfit">' +
        quickGridHtml +
        '<div class="body-title">明日穿搭</div>' + outfitRecHtml +
      '</div>' +
      /* 右：指标区（身高体重 | 肩胸腰臀 并排），下方接分类占比 */
      '<div class="stat-side">' +
        '<div class="metric-row">' +
          /* 身高体重 */
          '<div class="stat">' +
            '<div class="body-title">身高体重 <span class="body-badge">'+esc(bodyType)+'</span></div>' +
            '<div class="metric-grid">' +
              '<div class="metric"><label>身高</label><div class="inp"><input type="number" inputmode="decimal" data-k="h" value="'+m.h+'"><span class="u">cm</span></div></div>' +
              '<div class="metric"><label>体重</label><div class="inp"><input type="number" inputmode="decimal" data-k="w" value="'+m.w+'"><span class="u">kg</span></div></div>' +
            '</div>' +
          '</div>' +
          /* 肩胸腰臀 */
          '<div class="stat">' +
            '<div class="body-title">肩胸腰臀</div>' +
            '<div class="metric-grid">' +
              '<div class="metric"><label>肩</label><div class="inp"><input type="number" inputmode="decimal" data-k="shoulder" value="'+m.shoulder+'"><span class="u">cm</span></div></div>' +
              '<div class="metric"><label>胸</label><div class="inp"><input type="number" inputmode="decimal" data-k="bust" value="'+m.bust+'"><span class="u">cm</span></div></div>' +
              '<div class="metric"><label>腰</label><div class="inp"><input type="number" inputmode="decimal" data-k="waist" value="'+m.waist+'"><span class="u">cm</span></div></div>' +
              '<div class="metric"><label>臀</label><div class="inp"><input type="number" inputmode="decimal" data-k="hip" value="'+m.hip+'"><span class="u">cm</span></div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        /* 分类占比 */
        (distRows.length > 0 ?
          '<div class="dist-list"><div class="dist-card"><div class="dist-head">分类占比</div>'+distRows.join("")+'</div></div>'
          : '') +
      '</div>' +
    '</div>';

  /* 数据概览直接展示（不折叠） */
  v.innerHTML =
    '<div class="pg-title">我的衣橱</div>' +
    statsContent;
  bindItemEvents(v);
  bindMetricInputs(v);
  /* 首页「换一套」按钮（2×3 快捷网格内）单独绑定 */
  $$("[data-act=refresh-outfit]", v).forEach(function(b){
    b.addEventListener("click", function(){ refreshOutfitRec(); });
  });
  /* 异步加载明日穿搭推荐 */
  setTimeout(function(){ refreshOutfitRec(); }, 100);
}

  var metaDots = colorList.length ? '<div class="cl">'+colorList.map(function(c){ return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+swatchOf(c)+';margin-right:4px;vertical-align:-1px"></span>'; }).join("")+esc(colorList.map(colorLabel).join(" / "))+'</div>' : "";

function renderClothTab(key){
  var v = $("#view-"+key);
  if(!sdkOk){ v.innerHTML = stateBox("当前未连接资料库"); return; }
  var st = tableState[key];
  if(st==="loading"){
    v.innerHTML = '<div class="pg-title">'+DB[key].name+'</div><div class="skel-grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
    return;
  }
  if(st==="error"){
    v.innerHTML = '<div class="pg-title">'+DB[key].name+'</div>'+stateBox("数据读取失败，请检查网络后重试", key);
    return;
  }
  var rows = cache[key] || [];
  var preset = CLOTH_CATS[key] || [];
  var usedCats = [];
  rows.forEach(function(r){ var c=r["分类"]; if(c && usedCats.indexOf(c)<0) usedCats.push(c); });
  var allCats = preset.concat(usedCats.filter(function(c){ return preset.indexOf(c)<0; }));
  var sel = selectedCat[key] || "";

  /* 分类筛选 chips */
  var chips = '<button class="'+(sel===""?"on":"")+'" data-cat="">全部</button>';
  allCats.forEach(function(c){
    chips += '<button class="'+(sel===c?"on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });

  var filtered = sel ? rows.filter(function(r){ return r["分类"]===sel; }) : rows;

  /* 按分组构建折叠面板（默认全部折叠；选中具体分类时展开该唯一面板便于查看） */
  var panelsHtml = "";
  var defaultOpen = !!sel;
  if(filtered.length === 0){
    panelsHtml = accordionPanel(key+"-empty", "暂无"+DB[key].name, ICONS.hanger,
      '<div class="empty">'+ICONS.hanger.replace('viewBox','width="40" height="40" viewBox')+'<p>还没有'+DB[key].name+'，请到首页点击「添加」新增第一件</p></div>', "", false);
  } else {
    /* 按分类分组，按数量降序排列 */
    var groups = {};
    filtered.forEach(function(r){ var c = r["分类"]||"未分类"; if(!groups[c]) groups[c]=[]; groups[c].push(r); });
    var groupList = Object.keys(groups).map(function(c){ return {cat:c, items:groups[c], count:groups[c].length}; });
    /* 按数量从大到小排序 */
    groupList.sort(function(a,b){ return b.count - a.count; });

    groupList.forEach(function(g){
      var gridItems = g.items.map(function(r){ return itemCard(key, r); }).join("");
      panelsHtml += accordionPanel(key+"-"+g.cat, g.cat, null, '<div class="grid">'+gridItems+'</div>', g.count+" 件", defaultOpen);
    });
  }

  v.innerHTML =
    '<div class="pg-title">'+DB[key].name+'</div>' +
    '<div class="chips" style="margin-bottom:14px">'+chips+'</div>' +
    panelsHtml;
  bindAccordion(v);
  bindItemEvents(v);
  $$("#view-"+key+" .chips button").forEach(function(b){
    b.addEventListener("click", function(){
      selectedCat[key] = b.getAttribute("data-cat") || "";
      renderClothTab(key);
    });
  });
}

/* ================= 事件绑定 ================= */

  $$("[data-retry]", root).forEach(function(b){

  $$("[data-act=del]", root).forEach(function(b){

      e.stopPropagation();
      var card = b.closest("[data-key]");
      confirmDel(card.getAttribute("data-key"), card.getAttribute("data-id"));
    });
  });
  $$("[data-act=edit]", root).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      var card = b.closest("[data-key]");
      var key = card.getAttribute("data-key");
      var row = (cache[key]||[]).filter(function(r){ return r._id===card.getAttribute("data-id"); })[0];
      if(row) openEdit(key, row);
    });
  });
  $$("[data-act=add]", root).forEach(function(b){
    b.addEventListener("click", function(){ openAdd(b.getAttribute("data-key")); });
  });
  $$(".item .thumb", root).forEach(function(t){
    t.addEventListener("click", function(){
      var card = t.closest("[data-key]");
      var key = card.getAttribute("data-key");
      var row = (cache[key]||[]).filter(function(r){ return r._id===card.getAttribute("data-id"); })[0];
      if(row) openDetail(key, row);
    });
  });
}

/* ================= 写操作 ================= */
function doAdd(key, props){
  if(!sdkOk){ toast("未连接资料库，无法保存"); return; }
  markLoading();
  hideModal();
  var op = addRec(key, props);
  pendingWrite = { fn: function(){ return addRec(key, props); }, tab: key };
  op.then(function(res){
    pendingWrite = null;
    markOk();
    toast("已保存到线上衣橱");
    return fetchTable(key);
  }).catch(function(err){
    markErr();
    console.error("addRecord failed", err);
    toast("保存失败："+errMsg(err), true);
  });
}

function doEdit(key, id, props){
  if(!sdkOk){ toast("未连接资料库，无法保存"); return; }
  markLoading();
  hideModal();
  var op = updateRec(key, id, props);
  pendingWrite = { fn: function(){ return updateRec(key, id, props); }, tab: key };
  op.then(function(res){
    pendingWrite = null;
    markOk();
    toast("已更新");
    return fetchTable(key);
  }).catch(function(err){
    markErr();
    console.error("updateRecord failed", err);
    toast("保存失败："+errMsg(err), true);
  });
}

function confirmDel(key, id){
  var label = "";
  var row = (cache[key]||[]).filter(function(r){ return r._id===id; })[0];
  if(row) label = (row["名称"]||"这件衣物");
  var html =
    '<div class="confirm-box">' +
      '<div class="ic">'+ICONS.trash+'</div>' +
      '<h3>删除「'+esc(label)+'」？</h3>' +
      '<p>删除后将从线上衣橱移除，无法恢复。</p>' +
      '<div class="row"><button class="no" data-act="close">取消</button><button class="yes" id="cfYes">删除</button></div>' +
    '</div>';
  showModal(html);
  $("#cfYes").addEventListener("click", function(){
    if(!sdkOk){ toast("未连接资料库，无法删除"); return; }
    hideModal();

    var op = delRec(key, id);

      pendingWrite = null;

      toast("删除失败："+errMsg(err), true);
    });
  });
}

function errMsg(err){
  try{
    if(typeof err==="string") return err.slice(0,40);
    if(err && err.message) return String(err.message).slice(0,40);
  }catch(e){}
  return "请检查网络";
}

/* ================= 弹窗通用 ================= */
function showModal(html){
  var m = $("#modal");
  m.innerHTML = html;
  $("#modalMask").classList.add("show");
  $$("[data-act=close]", m).forEach(function(b){
    b.addEventListener("click", hideModal);
  });
  $("#modalMask").addEventListener("click", function(e){
    if(e.target === this) hideModal();
  });
}
function hideModal(){
  $("#modalMask").classList.remove("show");
  $("#modal").innerHTML = "";
}

/* ================= 图片压缩 ================= */
function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 800;
      var w = img.width, h = img.height;
      if(w > maxW){ h = h * maxW / w; w = maxW; }
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var out;
      try{ out = canvas.toDataURL("image/jpeg", 0.78); }
      catch(e){ out = ev.target.result; }
      cb(out);
    };
    img.onerror = function(){ toast("图片读取失败，请换一张试试"); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
